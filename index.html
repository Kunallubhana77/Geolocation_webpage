<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation Matrix</title>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap");

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Roboto Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #particleCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .matrix-btn {
            position: relative;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            color: #0F0;
            background: transparent;
            border: 2px solid #0F0;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 4px;
            overflow: hidden;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3), inset 0 0 10px rgba(0, 255, 0, 0.3);
            text-shadow: 0 0 5px #0F0;
        }

        .matrix-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 0, 0.4), transparent);
            transition: 0.5s;
        }

        .matrix-btn:hover {
            background: rgba(0, 255, 0, 0.1);
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.6), inset 0 0 20px rgba(0, 255, 0, 0.4);
            transform: scale(1.05);
            text-shadow: 0 0 10px #0F0, 0 0 20px #0F0;
        }

        .matrix-btn:hover::before {
            left: 100%;
        }

        .matrix-btn:active {
            transform: scale(0.95);
        }

        .location-display {
            min-height: 60px;
            color: #0F0;
            font-size: 18px;
            text-shadow: 0 0 5px #0F0;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .location-display.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .glitch-text {
            position: relative;
        }

        /* Scanline effect */
        body::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: repeating-linear-gradient(0deg,
                    rgba(0, 0, 0, 0.15),
                    rgba(0, 0, 0, 0.15) 1px,
                    transparent 1px,
                    transparent 2px);
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>

<body>

    <canvas id="particleCanvas"></canvas>

    <div class="container">
        <button class="matrix-btn" onclick="getLocation()">
            INITIATE TRACE
        </button>

        <div id="locationDisplay" class="location-display">
            <div id="statusText">SYSTEM READY</div>
            <div id="coordsText" style="margin-top: 10px; font-weight: bold; font-size: 22px;"></div>
        </div>
    </div>

    <script>

        // Matrix Rain Background
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];

        for (let x = 0; x < columns; x++) drops[x] = 1;

        function drawRain() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#0F0';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = String.fromCharCode(0x30A0 + Math.random() * 96);
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975)
                    drops[i] = 0;

                drops[i]++;
            }
        }

        setInterval(drawRain, 33);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });


        // Geolocation Logic with Matrix Effect
        function getLocation() {
            const display = document.getElementById('locationDisplay');
            const status = document.getElementById('statusText');
            const coords = document.getElementById('coordsText');

            display.classList.add('visible');
            status.innerText = "TRIANGULATING SIGNAL...";
            coords.innerText = "";

            
            // Matrix decoding effect variables
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let interval;

            navigator.geolocation.getCurrentPosition(function (position) {
                const lat = position.coords.latitude.toFixed(6);
                const long = position.coords.longitude.toFixed(6);
                const finalText = `LAT: ${lat} | LONG: ${long}`;

                status.innerText = "ACCESS GRANTED";

                let iteration = 0;
                clearInterval(interval);

                interval = setInterval(() => {
                    coords.innerText = finalText
                        .split("")
                        .map((letter, index) => {
                            if (index < iteration) {
                                return finalText[index];
                            }
                            return chars[Math.floor(Math.random() * 26)];
                        })
                        .join("");

                    if (iteration >= finalText.length) {
                        clearInterval(interval);
                    }

                    iteration += 1 / 2; // Decrypt speed
                }, 30);

            }, function (error) {
                status.innerText = "SIGNAL LOST";
                status.style.color = "red";
            });
        }
    </script>
</body>

</html>
